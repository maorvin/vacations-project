server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: כל כתובת שאינה קובץ קיים מחזירה את index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # קבצי ה-build מקבלים שם עם hash, אפשר לשמור אותם במטמון לאורך זמן
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
